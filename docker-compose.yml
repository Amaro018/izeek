services:
  # One-shot: sync the schema (and seed) before the app starts. Exits when done.
  migrate:
    build:
      context: .
      target: builder
    container_name: izeek-migrate
    command: sh -c "npx prisma db push && npx blitz db seed"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    restart: "no"
    networks:
      - cloudflare_net
      - db_net

  app:
    build: .
    container_name: izeek
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3006:3000"
    # Values come from .env locally, or Portainer's stack env vars in production.
    # No secrets are committed. See .env.example for the required keys.
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - APP_ORIGIN=${APP_ORIGIN}
      - BASE_URL=${BASE_URL}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
    volumes:
      - izeek_uploads:/app/public/uploads
    networks:
      - cloudflare_net
      - db_net

networks:
  cloudflare_net:
    external: true
  # MariaDB lives on its own external network (created by the mariadb stack).
  db_net:
    external: true
    name: mariadb_mariadb_network

volumes:
  izeek_uploads:
